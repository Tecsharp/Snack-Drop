# Snack-Drop: servidor (API + WebSockets), interfaz web y un nodo ejecutor local.
# Inícialo con ./setup.sh (genera .env con secretos aleatorios).
name: snackdrop
services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      SNACKDROP_DATA_DIR: /data
    volumes:
      - snackdrop-data:/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${SNACKDROP_HTTP_PORT:-28743}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./worker
      args:
        WITH_OFFICE: ${SNACKDROP_WORKER_OFFICE:-false}
        WITH_AI: ${SNACKDROP_WORKER_AI:-false}
    environment:
      SNACKDROP_SERVER: http://backend:8000
      SNACKDROP_TOKEN: ${SNACKDROP_LOCAL_NODE_TOKEN:?Ejecuta ./setup.sh}
      SNACKDROP_NODE_HOSTNAME: ${SNACKDROP_LOCAL_NODE_NAME:-master}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  snackdrop-data:
