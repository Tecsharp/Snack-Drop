# Nodo ejecutor para otra computadora. Inícialo con ./setup-worker.sh
name: snackdrop-worker
services:
  worker:
    build:
      context: ./worker
      args:
        WITH_OFFICE: ${SNACKDROP_WORKER_OFFICE:-false}
        WITH_AI: ${SNACKDROP_WORKER_AI:-false}
    env_file: worker.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
